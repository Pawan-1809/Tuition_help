databases:
  - name: tuition_connect_db
    databaseName: tuition_connect
    user: admin
    plan: free

services:
  - type: web
    name: tuition-connect-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuition_connect_db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: DJANGO_ALLOWED_HOSTS
        value: "tuition-connect-web.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.4"
