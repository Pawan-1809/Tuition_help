{% load static %}
<footer
  class="footer"
  id="footer"
  style="padding: var(--space-6) 0 var(--space-4) !important; margin-top: auto"
>
  <div class="container">
    <!-- Main Footer Row -->
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-4);
        margin-bottom: var(--space-4);
      "
    >
      <!-- Brand & Short Desc -->
      <div style="flex: 1; min-width: 250px">
        <div
          class="footer-brand"
          style="
            margin-bottom: var(--space-2);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.5rem;
          "
        >
          <i
            data-lucide="graduation-cap"
            style="width: 24px; height: 24px; color: var(--accent-primary)"
          ></i>
          Tuition<span class="text-gradient">Connect</span>
        </div>
        <p
          class="footer-desc"
          style="
            margin: 0;
            font-size: var(--text-sm);
            line-height: 1.4;
            color: var(--text-muted);
            max-width: 400px;
          "
        >
          Connecting passionate tutors with eager learners. Find your perfect
          tutor.
        </p>
      </div>

      <!-- Developer Quick Links -->
      <div
        style="
          display: flex;
          gap: var(--space-5);
          flex-wrap: wrap;
          align-items: center;
        "
      >
        <a
          href="mailto:pawankr16123114@gmail.com"
          class="social-link-text"
          style="
            color: var(--text-muted);
            font-size: var(--text-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: color 0.2s;
          "
          ><i data-lucide="mail" style="width: 16px; height: 16px"></i>
          Contact</a
        >
        <a
          href="https://pawan-portfolio-dev.vercel.app/"
          target="_blank"
          class="social-link-text"
          style="
            color: var(--text-muted);
            font-size: var(--text-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: color 0.2s;
          "
          ><i data-lucide="external-link" style="width: 16px; height: 16px"></i>
          Portfolio</a
        >
        <a
          href="https://github.com/Pawan-1809"
          target="_blank"
          class="social-link-text"
          style="
            color: var(--text-muted);
            font-size: var(--text-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: color 0.2s;
          "
          ><i data-lucide="code-2" style="width: 16px; height: 16px"></i>
          Source</a
        >
      </div>
    </div>

    <!-- Bottom Copyright & Socials row -->
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid rgba(150, 150, 150, 0.15);
        padding-top: var(--space-3);
        gap: var(--space-3);
      "
    >
      <p
        class="footer-copy"
        style="margin: 0; font-size: var(--text-sm); color: var(--text-muted)"
      >
        &copy; 2026 Tuition Connect. Crafted with ❤️ by
        <a
          href="https://pawan-portfolio-dev.vercel.app/"
          target="_blank"
          style="
            color: var(--accent-primary-light);
            text-decoration: none;
            font-weight: 600;
          "
          >Pawan Kumar</a
        >
      </p>
      <div
        class="social-links"
        style="margin: 0; display: flex; gap: var(--space-3)"
      >
        <a
          href="https://pawan-portfolio-dev.vercel.app/"
          target="_blank"
          rel="noopener"
          class="social-link"
          title="Portfolio"
          style="
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-main);
            color: var(--text-muted);
            box-shadow: var(--neu-shadow-sm);
            text-decoration: none;
            transition: all 0.2s;
          "
          ><i data-lucide="globe" style="width: 14px; height: 14px"></i
        ></a>
        <a
          href="https://github.com/Pawan-1809"
          target="_blank"
          rel="noopener"
          class="social-link"
          title="GitHub"
          style="
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-main);
            color: var(--text-muted);
            box-shadow: var(--neu-shadow-sm);
            text-decoration: none;
            transition: all 0.2s;
          "
          ><i data-lucide="github" style="width: 14px; height: 14px"></i
        ></a>
        <a
          href="https://www.instagram.com/mr.pawan.kumar/"
          target="_blank"
          rel="noopener"
          class="social-link"
          title="Instagram"
          style="
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-main);
            color: var(--text-muted);
            box-shadow: var(--neu-shadow-sm);
            text-decoration: none;
            transition: all 0.2s;
          "
          ><i data-lucide="instagram" style="width: 14px; height: 14px"></i
        ></a>
      </div>
    </div>
  </div>
</footer>

<style>
  .social-link-text:hover {
    color: var(--accent-primary) !important;
  }
  .social-link:hover {
    color: var(--accent-primary) !important;
    transform: translateY(-2px);
  }
</style>
